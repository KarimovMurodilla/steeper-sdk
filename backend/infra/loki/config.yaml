# Loki — storage for logs shipped by bots through the `steeper` library.
#
# Single-binary, filesystem-backed: no object storage, no clustering. That is
# deliberate — this instance only holds bot logs for a self-hosted Steeper
# deployment, and its retention keeps the volume bounded.

auth_enabled: false

server:
  http_listen_port: 3100
  # Loki's own logs are noise for an operator; only surface real problems.
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Retention lives here, not in the app: the compactor deletes expired chunks,
  # which is why the backend no longer runs a purge task.
  retention_period: 336h  # 14 days
  # A bot with a skewed clock must not be able to backfill arbitrary history.
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # 7 days
  # Bots can burst (a crash loop dumps tracebacks); these bound the damage.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 20MB
  max_query_series: 5000
  # Loki 3.x otherwise derives an extra `service_name` label from the stream;
  # the backend owns its label set, so keep it exactly as pushed.
  discover_service_name: []
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h
  compaction_interval: 10m

analytics:
  reporting_enabled: false
